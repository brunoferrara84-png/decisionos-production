name: M010.3 Zero-Founder-Reupload Smoke Test

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install pillow
      - name: Render controlled replay visual
        run: python renderer.py
      - name: Verify output
        run: |
          test -f output/DecisionOS_M0103_NVIDIA_VISUAL_SMOKE_TEST.mp4
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_name,width,height,r_frame_rate -of default=noprint_wrappers=1 output/DecisionOS_M0103_NVIDIA_VISUAL_SMOKE_TEST.mp4
      - name: Upload rendered artifact
        uses: actions/upload-artifact@v4
        with:
          name: DecisionOS-M0103-NVIDIA-Visual-Smoke-Test
          path: output/DecisionOS_M0103_NVIDIA_VISUAL_SMOKE_TEST.mp4
          if-no-files-found: error
          retention-days: 7
