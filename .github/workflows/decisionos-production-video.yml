      - name: Recover approved Primark voice artifact and apply approved pacing
        if: steps.job.outputs.has_job == 'true'
        shell: bash
        run: |
          VOICE_URL=$(python3 -c 'import json; print(json.load(open("work/job.json"))["voice_zip_url"])')
          curl -fL "$VOICE_URL" -o work/voice.zip
          unzip -o work/voice.zip -d work/voice
          WAV=$(find work/voice -type f -name '*.wav' | head -1)
          test -s "$WAV"
          cp "$WAV" work/voice_original.wav

          ffmpeg -y -i work/voice_original.wav -filter:a "atempo=0.92" work/voice_paced.wav
          test -s work/voice_paced.wav

          ORIGINAL_DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 work/voice_original.wav)
          PACED_DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 work/voice_paced.wav)
          echo "$PACED_DURATION" > work/paced_duration.txt
          echo "VOICE_PACING_PASS original=$ORIGINAL_DURATION paced=$PACED_DURATION atempo=0.92"

      - name: Render native 1080x1920 DecisionOS scenes with exact logo
        if: steps.job.outputs.has_job == 'true'
        shell: bash
        run: |
          cat > work/render_scenes.py <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          W, H = 1080, 1920
          GRAPHITE = '#0F1114'
          OFFWHITE = '#F2F2F2'
          LIME = '#C6FF00'
          GRAY500 = '#6B6F76'
          GRAY700 = '#2A2D31'

          FONT = '/usr/share/fonts/truetype/inter/Inter-Regular.otf'
          BOLD = '/usr/share/fonts/truetype/inter/Inter-Bold.otf'

          if not Path(FONT).exists():
              matches = list(Path('/usr/share/fonts').rglob('Inter-Regular.*'))
              if matches:
                  FONT = str(matches[0])

          if not Path(BOLD).exists():
              matches = list(Path('/usr/share/fonts').rglob('Inter-Bold.*'))
              if matches:
                  BOLD = str(matches[0])

          if not Path(FONT).exists() or not Path(BOLD).exists():
              raise RuntimeError('Inter font unavailable')

          def font(size, bold=False):
              return ImageFont.truetype(BOLD if bold else FONT, size)

          def wrap(draw, text, ft, maxw):
              out = []
              line = ''
              for word in text.split():
                  trial = word if not line else line + ' ' + word
                  if draw.textbbox((0, 0), trial, font=ft)[2] <= maxw:
                      line = trial
                  else:
                      if line:
                          out.append(line)
                      line = word
              if line:
                  out.append(line)
              return out

          def draw_lines(draw, text, ft, x, y, maxw, fill, gap=1.18):
              for line in wrap(draw, text, ft, maxw):
                  draw.text((x, y), line, font=ft, fill=fill)
                  y += int(ft.size * gap)
              return y

          job = json.load(open('work/job.json', encoding='utf-8'))
          if not job.get('brand_identity_resolved'):
              raise RuntimeError('Brand Identity not resolved')

          logo = Image.open('work/decisionos_logo.png').convert('RGBA')
          if logo.size != (355, 100):
              raise RuntimeError(f'Unexpected exact logo dimensions: {logo.size}')

          scenes = job['scenes']
          bounds = job['scene_boundaries']
          if len(bounds) != len(scenes) + 1:
              raise RuntimeError('Scene boundary mismatch')

          for i, scene in enumerate(scenes, 1):
              image = Image.new('RGB', (W, H), GRAPHITE)
              draw = ImageDraw.Draw(image)

              draw.text((90, 115), scene['eyebrow'], font=font(28, True), fill=LIME)
              draw.line((90, 185, 990, 185), fill=GRAY700, width=2)

              y = 285
              y = draw_lines(draw, scene['title'], font(72, True), 90, y, 900, OFFWHITE, 1.12)

              if scene.get('accent'):
                  y += 55
                  y = draw_lines(draw, scene['accent'], font(45, True), 90, y, 880, LIME, 1.18)

              if scene.get('body'):
                  y += 70
                  y = draw_lines(draw, scene['body'], font(38), 90, y, 880, OFFWHITE, 1.38)

              for metric in scene.get('metrics', []):
                  y += 70
                  draw.text((90, y), metric['value'], font=font(86, True), fill=LIME)
                  y += 110
                  y = draw_lines(draw, metric['label'], font(30), 90, y, 850, GRAY500, 1.28)

              draw.line((90, 1700, 990, 1700), fill=GRAY700, width=2)
              image.paste(logo, (90, 1730), logo)
              draw.text((930, 1765), f'{i:02d}', font=font(22), fill=GRAY500)

              out = Path('scenes') / f'scene_{i:02d}.png'
              image.save(out)

              if image.size != (1080, 1920):
                  raise RuntimeError('Non-native scene')

          print('VISUAL_RENDER_PASS', len(scenes), 'EXACT_LOGO_PASS')
          PY
          python3 work/render_scenes.py

      - name: Assemble sentence-safe paced MP4
        if: steps.job.outputs.has_job == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json

          job = json.load(open('work/job.json'))
          bounds = job['scene_boundaries']
          paced = float(open('work/paced_duration.txt').read().strip())
          original = float(job['audio_duration'])
          scale = paced / original

          with open('work/concat.txt', 'w') as f:
              for i in range(len(job['scenes'])):
                  duration = (bounds[i + 1] - bounds[i]) * scale
                  f.write(f"file '../scenes/scene_{i+1:02d}.png'\n")
                  f.write(f"duration {duration:.3f}\n")
              f.write(f"file '../scenes/scene_{len(job['scenes']):02d}.png'\n")

          print('SEMANTIC_TIMING_SCALE_PASS', scale)
          PY

          ffmpeg -y -f concat -safe 0 -i work/concat.txt -i work/voice_paced.wav             -vf "fps=30,format=yuv420p"             -c:v libx264 -preset medium -crf 18             -c:a aac -b:a 192k -ar 48000             -movflags +faststart -shortest             "output/${{ steps.job.outputs.job_id }}.mp4"

      - name: Actual MP4 technical QA
        if: steps.job.outputs.has_job == 'true'
        shell: bash
        run: |
          MP4="output/${{ steps.job.outputs.job_id }}.mp4"
          test -s "$MP4"

          ffprobe             -v error             -show_entries stream=codec_type,codec_name,width,height,sample_rate,channels             -show_entries format=duration,size             -of json "$MP4" | tee output/technical_qa.json

          python3 - <<'PY'
          import json
          import subprocess

          job = json.load(open('work/job.json'))
          path = 'output/' + job['job_id'] + '.mp4'

          probe = json.loads(subprocess.check_output([
              'ffprobe', '-v', 'error',
              '-show_streams',
              '-show_format',
              '-of', 'json',
              path
          ]))

          video = next(s for s in probe['streams'] if s['codec_type'] == 'video')
          audio = next(s for s in probe['streams'] if s['codec_type'] == 'audio')

          assert video['codec_name'] == 'h264'
          assert int(video['width']) == 1080 and int(video['height']) == 1920
          assert audio['codec_name'] == 'aac'

          duration = float(probe['format']['duration'])
          target = float(open('work/paced_duration.txt').read().strip())
          assert abs(duration - target) < 0.35, (duration, target)

          print('MP4_TECHNICAL_QA_PASS', duration)
          print('FOUNDER_REPAIR_001_PASS exact_logo=yes voice_atempo=0.92')
          PY

      - name: Upload DecisionOS mobile video artifact
        if: steps.job.outputs.has_job == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DecisionOS-Production-${{ steps.job.outputs.job_id }}-Repair001
          path: |
            output/*.mp4
            output/technical_qa.json
            scenes/*.png
          if-no-files-found: error
          retention-days: 7
