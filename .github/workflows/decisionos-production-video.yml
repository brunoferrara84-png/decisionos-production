name: DecisionOS Production Video Worker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: decisionos-production-video
  cancel-in-progress: false

jobs:
  production-video:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Fetch latest DecisionOS production job
        id: job
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work output rendered/scenes
          URL="https://res.cloudinary.com/uhdjssyk/raw/upload/decisionos/m010_5/production_job_latest"
          CODE=$(curl --silent --show-error --location --output work/job.json --write-out "%{http_code}" "${URL}?nocache=$(date +%s)" || true)
          if [ "$CODE" != "200" ]; then
            echo "No active DecisionOS production job."
            echo "has_job=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          JOB_ID=$(python3 - <<'PYJOB'
          import json
          try:
              job=json.load(open('work/job.json',encoding='utf-8'))
          except Exception:
              print('')
          else:
              print(job.get('job_id',''))
          PYJOB
          )
          if [ -z "$JOB_ID" ]; then
            echo "DecisionOS production mailbox is intentionally idle/consumed."
            echo "has_job=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_job=true" >> "$GITHUB_OUTPUT"
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "Production job: $JOB_ID"

      - name: Skip already processed DecisionOS production job
        id: guard
        if: steps.job.outputs.has_job == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          JOB_ID="${{ steps.job.outputs.job_id }}"
          ARTIFACT_NAME="DecisionOS-Production-${JOB_ID}-Bundle-v1"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=${ARTIFACT_NAME}" \
            -o work/artifacts.json
          COUNT=$(python3 -c 'import json; print(json.load(open("work/artifacts.json")).get("total_count",0))')
          if [ "$COUNT" -gt 0 ]; then
            echo "VIDEO_JOB_ALREADY_PROCESSED $JOB_ID"
            echo "should_render=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_render=true" >> "$GITHUB_OUTPUT"
          echo "VIDEO_JOB_RENDER_AUTHORIZED $JOB_ID"

      - name: Checkout production assets
        if: steps.job.outputs.has_job == 'true' && steps.guard.outputs.should_render == 'true'
        uses: actions/checkout@v4

      - name: Install production dependencies
        if: steps.job.outputs.has_job == 'true' && steps.guard.outputs.should_render == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-inter unzip
          python3 -m pip install --upgrade pillow

      - name: Resolve Founder-approved HD DecisionOS logo master
        if: steps.job.outputs.has_job == 'true' && steps.guard.outputs.should_render == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work output rendered/scenes
          MASTER="decisionos_assets/decisionos_logo_master.png"
          test -s "$MASTER"
          cp "$MASTER" work/decisionos_logo_master.png
          ACTUAL_SHA=$(sha256sum work/decisionos_logo_master.png | awk '{print $1}')
          EXPECTED_SHA="f02d65390cc0e034533d75db062744fda6611495e25ec8de948e93c3945de7d1"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          python3 - <<'PYLOGO'
          import json
          from PIL import Image
          job=json.load(open('work/job.json',encoding='utf-8'))
          assert job.get('brand_identity_resolved') is True
          assert job.get('brand_identity_logo_sha256') == 'f02d65390cc0e034533d75db062744fda6611495e25ec8de948e93c3945de7d1'
          im=Image.open('work/decisionos_logo_master.png')
          assert im.size == (2172,724), im.size
          assert 'Visual Grammar v1.1' in job.get('visual_grammar','')
          print('BRAND_MASTER_PASS', im.size)
          PYLOGO

      - name: Recover exact scene-locked voice artifact
        if: steps.job.outputs.has_job == 'true' && steps.guard.outputs.should_render == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VOICE_URL=$(python3 -c 'import json; print(json.load(open("work/job.json"))["voice_zip_url"])')
          curl -fL "$VOICE_URL" -o work/voice.zip
          mkdir -p work/voice
          unzip -o work/voice.zip -d work/voice
          WAV=$(find work/voice -type f -name '*.wav' | head -1)
          MANIFEST=$(find work/voice -type f -name '*manifest.json' | head -1)
          test -s "$WAV"
          test -s "$MANIFEST"
          cp "$WAV" work/voice_original.wav
          cp "$MANIFEST" output/voice_manifest.json
          python3 - <<'PYVOICE'
          import json
          job=json.load(open('work/job.json',encoding='utf-8'))
          m=json.load(open('output/voice_manifest.json',encoding='utf-8'))
          assert m['schema_version']=='DecisionOS Scene-Locked Voice Manifest v1'
          assert m['candidate_id']==job['candidate_id']
          assert m['job_id']==job['voice_job_id']
          assert m['semantic_audio_qa']=='PASS'
          assert m['scene_locked'] is True
          assert m['scene_count']==len(job['scenes'])==job['scene_count']
          assert all(s['semantic_qa']=='PASS' for s in m['scenes'])
          assert len(m['scene_boundaries'])==len(job['scenes'])+1
          assert all(m['scene_boundaries'][i] <= m['scene_boundaries'][i+1] for i in range(len(m['scene_boundaries'])-1))
          assert abs(float(m['raw_audio_duration_seconds'])-float(job['audio_duration'])) < 0.05
          assert len(job['scene_boundaries'])==len(m['scene_boundaries'])
          assert all(abs(float(a)-float(b))<0.05 for a,b in zip(job['scene_boundaries'],m['scene_boundaries']))
          print('SCENE_LOCKED_VOICE_MANIFEST_PASS', m['scene_count'])
          PYVOICE
          ffmpeg -y -loglevel error -i work/voice_original.wav -filter:a "atempo=0.92" work/voice_paced.wav
          PACED_DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 work/voice_paced.wav)
          echo "$PACED_DURATION" > work/paced_duration.txt
          echo "VOICE_PACING_PASS paced=$PACED_DURATION atempo=0.92"

      - name: Render Visual Grammar v1.1 scenes and LinkedIn Summary Card
        if: steps.job.outputs.has_job == 'true' && steps.guard.outputs.should_render == 'true'
        shell: bash
        env:
          JOB_JSON: work/job.json
          LOGO_PNG: work/decisionos_logo_master.png
          OUT_DIR: rendered
        run: |
          set -euo pipefail
          cat > work/render_visual_grammar_v11.py <<'PYRENDER'
          import json, re, math, os, hashlib, textwrap
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          
          W,H=1080,1920
          CARD_W,CARD_H=1080,1350
          GRAPHITE='#0F1114'; OFFWHITE='#F2F2F2'; LIME='#C6FF00'; GRAY700='#2A2D31'; GRAY500='#6B6F76'
          FONT_REG='/usr/share/fonts/opentype/inter/Inter-Regular.otf'
          FONT_BOLD='/usr/share/fonts/opentype/inter/Inter-Bold.otf'
          SAFE_X=84
          
          
          def ft(size,bold=False): return ImageFont.truetype(FONT_BOLD if bold else FONT_REG,size)
          
          def txt_bbox(draw,s,font):
              b=draw.textbbox((0,0),s,font=font); return b[2]-b[0], b[3]-b[1]
          
          def wrap(draw,text,font,maxw,max_lines=None):
              words=str(text).split(); lines=[]; cur=''
              for word in words:
                  trial=word if not cur else cur+' '+word
                  if txt_bbox(draw,trial,font)[0] <= maxw:
                      cur=trial
                  else:
                      if cur: lines.append(cur)
                      cur=word
              if cur: lines.append(cur)
              if max_lines and len(lines)>max_lines:
                  lines=lines[:max_lines]
                  last=lines[-1]
                  while txt_bbox(draw,last+'…',font)[0]>maxw and len(last)>3:
                      last=last[:-1]
                  lines[-1]=last.rstrip()+'…'
              return lines
          
          def draw_wrapped(draw,text,font,x,y,maxw,fill,leading=1.15,max_lines=None,anchor='la'):
              lines=wrap(draw,text,font,maxw,max_lines)
              yy=y
              for line in lines:
                  draw.text((x,yy),line,font=font,fill=fill,anchor=anchor)
                  yy += int(font.size*leading)
              return yy
          
          def trim_logo(im):
              # Crop only uniform outer graphite/black padding, preserving exact rendered identity pixels.
              rgb=im.convert('RGB')
              bg=rgb.getpixel((0,0))
              px=rgb.load(); xs=[]; ys=[]
              for y in range(rgb.height):
                  for x in range(rgb.width):
                      r,g,b=px[x,y]
                      if abs(r-bg[0])+abs(g-bg[1])+abs(b-bg[2]) > 22:
                          xs.append(x); ys.append(y)
              if not xs: return im
              pad=20
              box=(max(0,min(xs)-pad),max(0,min(ys)-pad),min(rgb.width,max(xs)+pad),min(rgb.height,max(ys)+pad))
              return im.crop(box)
          
          def add_brand(img, logo, scene_no=None):
              draw=ImageDraw.Draw(img)
              draw.line((SAFE_X,H-208,W-SAFE_X,H-208),fill=GRAY700,width=2)
              target_w=390
              ratio=target_w/logo.width
              l=logo.resize((target_w,max(1,int(logo.height*ratio))),Image.Resampling.LANCZOS)
              img.paste(l,(SAFE_X,H-170),l if l.mode=='RGBA' else None)
              if scene_no is not None:
                  draw.text((W-SAFE_X,H-116),f'{scene_no:02d}',font=ft(22),fill=GRAY500,anchor='ra')
          
          def eyebrow(draw,label):
              draw.text((SAFE_X,105),label.upper(),font=ft(27,True),fill=LIME)
          
          def split_emphasis(title):
              # preserve title, but allow / separators for selected phrase layouts
              if ' OR ' in title:
                  a,b=title.split(' OR ',1); return a.strip(' ?'),b.strip(' ?')
              if ' ≠ ' in title:
                  a,b=title.split(' ≠ ',1); return a,b
              return None
          
          def scene_hook(scene,logo,idx):
              img=Image.new('RGB',(W,H),GRAPHITE); d=ImageDraw.Draw(img); eyebrow(d,scene['eyebrow'])
              parts=split_emphasis(scene['title'])
              y=360
              if parts:
                  a,b=parts
                  d.text((SAFE_X,y),a,font=ft(122,True),fill=OFFWHITE); y+=150
                  d.text((SAFE_X+55,y),'OR',font=ft(42,True),fill=LIME); y+=80
                  d.text((SAFE_X,y),b+'?',font=ft(122,True),fill=OFFWHITE); y+=185
              else:
                  y=draw_wrapped(d,scene['title'],ft(112,True),SAFE_X,y,900,OFFWHITE,1.02,4)
              d.line((SAFE_X,y+25,SAFE_X+210,y+25),fill=LIME,width=8)
              y+=82
              y=draw_wrapped(d,scene.get('accent',''),ft(43,True),SAFE_X,y,870,LIME,1.17,3)
              y+=45
              draw_wrapped(d,scene.get('body',''),ft(30),SAFE_X,y,820,GRAY500,1.35,3)
              add_brand(img,logo,idx); return img
          
          def scene_case(scene,logo,idx):
              img=Image.new('RGB',(W,H),GRAPHITE); d=ImageDraw.Draw(img); eyebrow(d,scene['eyebrow'])
              title=scene['title']
              # split at × for a visual relationship rather than a title block
              if '×' in title:
                  a,b=[x.strip() for x in title.split('×',1)]
                  d.text((SAFE_X,350),a,font=ft(88,True),fill=OFFWHITE)
                  d.text((W//2,575),'×',font=ft(88,True),fill=LIME,anchor='mm')
                  d.text((W-SAFE_X,760),b,font=ft(88,True),fill=OFFWHITE,anchor='ra')
                  d.line((SAFE_X,660,W-SAFE_X,660),fill=GRAY700,width=2)
              else:
                  draw_wrapped(d,title,ft(86,True),SAFE_X,350,900,OFFWHITE,1.06,3)
              # relationship strip
              accent=scene.get('accent','')
              d.text((SAFE_X,930),'CAPACITY PATH',font=ft(24,True),fill=GRAY500)
              y=1010
              if '→' in accent:
                  chunks=[x.strip() for x in accent.split('→')]
                  x=SAFE_X
                  for j,ch in enumerate(chunks):
                      tw,_=txt_bbox(d,ch,ft(35,True));
                      d.text((x,y),ch,font=ft(35,True),fill=OFFWHITE)
                      x+=tw+28
                      if j<len(chunks)-1:
                          d.text((x,y),'→',font=ft(35,True),fill=LIME); x+=58
              else:
                  draw_wrapped(d,accent,ft(38,True),SAFE_X,y,880,LIME,1.2,2)
              orientation=scene.get('orientation') or {}
              if orientation:
                  labels=[('WHO',orientation.get('who','')),('WHAT',orientation.get('what','')),('WHERE',orientation.get('where','')),('SCALE',orientation.get('scale',''))]
                  yy=1180
                  for lab,val in labels:
                      if not val: continue
                      d.text((SAFE_X,yy),lab,font=ft(20,True),fill=GRAY500)
                      draw_wrapped(d,val,ft(26,True),SAFE_X+115,yy-4,730,OFFWHITE,1.15,2)
                      yy+=92
              else:
                  draw_wrapped(d,scene.get('body',''),ft(31),SAFE_X,1190,850,GRAY500,1.35,4)
              add_brand(img,logo,idx); return img
          
          def scene_hero_number(scene,logo,idx):
              img=Image.new('RGB',(W,H),GRAPHITE); d=ImageDraw.Draw(img); eyebrow(d,scene['eyebrow'])
              metrics=scene.get('metrics') or []
              val=metrics[0]['value'] if metrics else re.findall(r'\d+[\.,]?\d*',scene['title'])[0] if re.findall(r'\d+[\.,]?\d*',scene['title']) else scene['title']
              label=metrics[0]['label'] if metrics else scene['title']
              d.text((W//2,565),str(val),font=ft(260,True),fill=LIME,anchor='mm')
              d.text((W//2,755),'GIORNI' if str(val)=='22' else label.upper(),font=ft(62,True),fill=OFFWHITE,anchor='mm')
              # timeline from accent
              accent=scene.get('accent','')
              if '→' in accent:
                  a,b=[x.strip() for x in accent.split('→',1)]
                  y=1015; x1=170; x2=910
                  d.line((x1,y,x2,y),fill=GRAY700,width=5)
                  d.ellipse((x1-11,y-11,x1+11,y+11),fill=LIME); d.ellipse((x2-11,y-11,x2+11,y+11),fill=LIME)
                  d.text((x1,y-70),a,font=ft(31,True),fill=OFFWHITE,anchor='ma'); d.text((x2,y-70),b,font=ft(31,True),fill=OFFWHITE,anchor='ma')
                  d.polygon([(x2,y),(x2-24,y-15),(x2-24,y+15)],fill=LIME)
              else:
                  d.text((W//2,1000),accent,font=ft(38,True),fill=LIME,anchor='ma')
              draw_wrapped(d,scene.get('body',''),ft(29),SAFE_X,1195,880,GRAY500,1.32,4)
              add_brand(img,logo,idx); return img
          
          def scene_mechanism(scene,logo,idx):
              img=Image.new('RGB',(W,H),GRAPHITE); d=ImageDraw.Draw(img); eyebrow(d,scene['eyebrow'])
              parts=split_emphasis(scene['title'])
              if parts:
                  a,b=parts
                  d.text((SAFE_X,390),a,font=ft(88,True),fill=OFFWHITE)
                  d.text((W//2,610),'≠',font=ft(115,True),fill=LIME,anchor='mm')
                  d.text((W-SAFE_X,800),b,font=ft(88,True),fill=OFFWHITE,anchor='ra')
              else:
                  draw_wrapped(d,scene['title'],ft(88,True),SAFE_X,380,900,OFFWHITE,1.08,3)
              d.text((SAFE_X,1010),scene.get('accent',''),font=ft(39,True),fill=LIME)
              # extract compact mechanism tokens from first clause
              body=scene.get('body','')
              first=body.split('.')[0]
              tokens=[x.strip() for x in re.split(r',| e ',first.replace('devono essere compatibili','')) if x.strip()]
              tokens=tokens[:4]
              y=1180
              if tokens:
                  x=SAFE_X
                  for j,t in enumerate(tokens):
                      d.text((x,y),t.upper(),font=ft(26,True),fill=OFFWHITE)
                      tw,_=txt_bbox(d,t.upper(),ft(26,True)); x+=tw+28
                      if j<len(tokens)-1:
                          d.ellipse((x,y+12,x+9,y+21),fill=LIME); x+=36
              draw_wrapped(d,'.'.join(body.split('.')[1:]).strip(' .'),ft(28),SAFE_X,1310,860,GRAY500,1.35,3)
              add_brand(img,logo,idx); return img
          
          def scene_decision(scene,logo,idx):
              img=Image.new('RGB',(W,H),GRAPHITE); d=ImageDraw.Draw(img); eyebrow(d,scene['eyebrow'])
              draw_wrapped(d,scene['title'],ft(58,True),SAFE_X,320,900,OFFWHITE,1.08,4)
              # Decision landing as two steps, not paragraph
              accent=scene.get('accent','')
              chunks=[x.strip() for x in accent.split('.') if x.strip()]
              if len(chunks)>=2:
                  y=800
                  d.text((SAFE_X,y),chunks[0].upper()+'.',font=ft(78,True),fill=LIME); y+=150
                  d.line((SAFE_X,y,SAFE_X+260,y),fill=GRAY700,width=5); d.polygon([(SAFE_X+260,y),(SAFE_X+230,y-18),(SAFE_X+230,y+18)],fill=LIME); y+=100
                  d.text((SAFE_X,y),chunks[1].upper()+'.',font=ft(78,True),fill=OFFWHITE); y+=155
              else:
                  y=800; y=draw_wrapped(d,accent,ft(78,True),SAFE_X,y,880,LIME,1.05,3)
              draw_wrapped(d,scene.get('body',''),ft(29),SAFE_X,1370,850,GRAY500,1.32,3)
              add_brand(img,logo,idx); return img
          
          def scene_watch(scene,logo,idx):
              img=Image.new('RGB',(W,H),GRAPHITE); d=ImageDraw.Draw(img); eyebrow(d,scene['eyebrow'])
              y=320; y=draw_wrapped(d,scene['title'],ft(92,True),SAFE_X,y,900,OFFWHITE,1.02,3)
              d.text((SAFE_X,y+45),scene.get('accent',''),font=ft(37,True),fill=LIME); y+=150
              body=scene.get('body','')
              first=body.split('.')[0]
              items=[x.strip() for x in first.split('·') if x.strip()]
              yy=y+80
              for i,item in enumerate(items[:4],1):
                  d.text((SAFE_X,yy),f'{i:02d}',font=ft(24,True),fill=LIME)
                  d.line((SAFE_X+60,yy+14,SAFE_X+120,yy+14),fill=GRAY700,width=3)
                  d.text((SAFE_X+150,yy),item.upper(),font=ft(38,True),fill=OFFWHITE)
                  yy+=120
              rest='.'.join(body.split('.')[1:]).strip(' .')
              if rest:
                  draw_wrapped(d,rest,ft(28),SAFE_X,yy+20,850,GRAY500,1.34,3)
              add_brand(img,logo,idx); return img
          
          def infer_kind(scene):
              e=scene.get('eyebrow','').upper(); title=scene.get('title','').upper()
              if e in ('SIGNAL','HERO NUMBER') or scene.get('metrics'): return 'hero'
              if 'CASE' in e or 'COMPANY' in e: return 'case'
              if 'MECHANISM' in e or 'RELATIONSHIP' in e: return 'mechanism'
              if e=='DECISION' or 'LANDING' in e: return 'decision'
              if 'WATCH' in e: return 'watch'
              if '?' in title or 'TENSION' in e or 'DECISION' in e: return 'hook'
              return 'hook'
          
          def make_summary(job,logo):
              scenes=job['scenes']; img=Image.new('RGB',(CARD_W,CARD_H),GRAPHITE); d=ImageDraw.Draw(img)
              # brand
              l=logo.copy(); target_w=430; ratio=target_w/l.width; l=l.resize((target_w,int(l.height*ratio)),Image.Resampling.LANCZOS); img.paste(l,(70,60),l if l.mode=='RGBA' else None)
              d.line((70,235,1010,235),fill=GRAY700,width=2)
              case=next((s for s in scenes if 'CASE' in s.get('eyebrow','').upper()),scenes[0])
              q=next((s for s in scenes if '?' in s.get('title','')),scenes[0])
              mech=next((s for s in scenes if 'MECHANISM' in s.get('eyebrow','').upper()),None)
              dec=next((s for s in scenes if s.get('eyebrow','').upper()=='DECISION'),scenes[-1])
              watch=next((s for s in scenes if 'WATCH' in s.get('eyebrow','').upper()),None)
              metric=None
              for s in scenes:
                  if s.get('metrics'): metric=s['metrics'][0]; break
              d.text((70,285),'COMPANY / CASE',font=ft(22,True),fill=GRAY500)
              draw_wrapped(d,case['title'],ft(49,True),70,325,930,OFFWHITE,1.05,2)
              d.text((70,465),'DECISION QUESTION',font=ft(22,True),fill=GRAY500)
              draw_wrapped(d,q['title'],ft(64,True),70,505,920,OFFWHITE,1.05,2)
              # insight strip
              d.line((70,690,1010,690),fill=GRAY700,width=2)
              d.text((70,735),'KEY INSIGHT',font=ft(22,True),fill=GRAY500)
              insight=(mech['title'] if mech else dec['title'])
              draw_wrapped(d,insight,ft(52,True),70,775,660,OFFWHITE,1.06,2)
              if mech and mech.get('accent'):
                  draw_wrapped(d,mech['accent'],ft(28,True),70,905,620,LIME,1.18,2)
              if metric:
                  d.text((1010,790),str(metric['value']),font=ft(118,True),fill=LIME,anchor='ra')
                  draw_wrapped(d,metric['label'],ft(22),1010,920,260,GRAY500,1.2,3,anchor='ra')
              d.line((70,1030,1010,1030),fill=GRAY700,width=2)
              d.text((70,1075),'DECISION / WATCH NEXT',font=ft(22,True),fill=GRAY500)
              landing=dec.get('accent') or dec.get('title','')
              draw_wrapped(d,landing,ft(36,True),70,1115,930,OFFWHITE,1.12,2)
              if watch:
                  draw_wrapped(d,watch.get('accent') or watch.get('title',''),ft(24),70,1220,900,LIME,1.15,2)
              return img
          
          def main():
              job_path=Path(os.environ.get('JOB_JSON','work/job.json'))
              logo_path=Path(os.environ.get('LOGO_PNG','work/decisionos_logo_master.png'))
              out_dir=Path(os.environ.get('OUT_DIR','rendered')); scenes_dir=out_dir/'scenes'; scenes_dir.mkdir(parents=True,exist_ok=True)
              job=json.loads(job_path.read_text(encoding='utf-8'))
              logo_bytes=logo_path.read_bytes(); sha=hashlib.sha256(logo_bytes).hexdigest()
              expected=job.get('brand_identity_logo_sha256')
              if expected and sha!=expected: raise RuntimeError(f'Logo SHA mismatch {sha} != {expected}')
              logo=trim_logo(Image.open(logo_path).convert('RGBA'))
              kinds=[]
              for idx,scene in enumerate(job['scenes'],1):
                  kind=infer_kind(scene); kinds.append(kind)
                  render_scene=dict(scene)
                  if kind=='case' and job.get('company_orientation'):
                      render_scene['orientation']=job['company_orientation']
                  fn={'hook':scene_hook,'case':scene_case,'hero':scene_hero_number,'mechanism':scene_mechanism,'decision':scene_decision,'watch':scene_watch}[kind]
                  im=fn(render_scene,logo,idx); im.save(scenes_dir/f'scene_{idx:02d}.png',quality=95)
              card=make_summary(job,logo); card.save(out_dir/'linkedin_summary_card.png',quality=95)
              qa={
                'schema_version':'DecisionOS Visual Structural QA v1',
                'candidate_id':job.get('candidate_id'),'job_id':job.get('job_id'),
                'visual_grammar':job.get('visual_grammar'),'logo_sha256':sha,
                'scene_count':len(job['scenes']),'scene_kinds':kinds,
                'unique_scene_archetypes':len(set(kinds)),
                'short_dimensions':[W,H],'summary_card_dimensions':[CARD_W,CARD_H],
                'structural_checks':{
                  'signal_first_archetype_diversity':len(set(kinds))>=min(4,len(kinds)),
                  'mobile_native_1080x1920':True,
                  'summary_card_1080x1350':True,
                  'hd_master_logo_exact_sha': bool(expected and sha==expected),
                  'publication_authorized_false': job.get('publication_authorized') is False,
                  'scene_count_matches_boundaries':len(job.get('scene_boundaries',[]))==len(job['scenes'])+1
                },
                'subjective_qa_note':'VG1-VG7 and VF1-VF10 require actual-artifact visual inspection; this file records structural evidence only.'
              }
              (out_dir/'visual_structural_qa.json').write_text(json.dumps(qa,ensure_ascii=False,indent=2),encoding='utf-8')
              print(json.dumps(qa,ensure_ascii=False,indent=2))
          
          if __name__=='__main__': main()
          PYRENDER
          python3 work/render_visual_grammar_v11.py
          cp rendered/linkedin_summary_card.png output/linkedin_summary_card.png
          cp rendered/visual_structural_qa.json output/visual_structural_qa.json

      - name: Assemble signal-first DecisionOS Short
        if: steps.job.outputs.has_job == 'true' && steps.guard.outputs.should_render == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCONCAT'
          import json
          job=json.load(open('work/job.json',encoding='utf-8'))
          paced=float(open('work/paced_duration.txt').read().strip())
          original=float(job['audio_duration'])
          scale=paced/original
          with open('work/concat.txt','w',encoding='utf-8') as f:
              for i in range(len(job['scenes'])):
                  duration=(job['scene_boundaries'][i+1]-job['scene_boundaries'][i])*scale
                  f.write(f"file '../rendered/scenes/scene_{i+1:02d}.png'\n")
                  f.write(f"duration {duration:.3f}\n")
              f.write(f"file '../rendered/scenes/scene_{len(job['scenes']):02d}.png'\n")
          print('SEMANTIC_TIMING_SCALE_PASS',scale)
          PYCONCAT
          PACED_DURATION=$(cat work/paced_duration.txt)
          ffmpeg -y -loglevel error \
            -f concat -safe 0 -i work/concat.txt \
            -i work/voice_paced.wav \
            -vf "fps=30,format=yuv420p" \
            -c:v libx264 -preset medium -crf 18 \
            -c:a aac -b:a 192k -ar 48000 \
            -movflags +faststart \
            -t "$PACED_DURATION" \
            "output/${{ steps.job.outputs.job_id }}.mp4"

      - name: Actual artifact technical QA
        if: steps.job.outputs.has_job == 'true' && steps.guard.outputs.should_render == 'true'
        shell: bash
        run: |
          set -euo pipefail
          MP4="output/${{ steps.job.outputs.job_id }}.mp4"
          test -s "$MP4"
          test -s output/linkedin_summary_card.png
          ffprobe -v error -show_streams -show_format -of json "$MP4" > output/technical_qa.json
          python3 - <<'PYQA'
          import json
          from PIL import Image
          job=json.load(open('work/job.json',encoding='utf-8'))
          probe=json.load(open('output/technical_qa.json',encoding='utf-8'))
          video=next(s for s in probe['streams'] if s['codec_type']=='video')
          audio=next(s for s in probe['streams'] if s['codec_type']=='audio')
          assert video['codec_name']=='h264'
          assert int(video['width'])==1080 and int(video['height'])==1920
          assert audio['codec_name']=='aac'
          duration=float(probe['format']['duration'])
          target=float(open('work/paced_duration.txt').read().strip())
          assert abs(duration-target)<0.15,(duration,target)
          card=Image.open('output/linkedin_summary_card.png')
          assert card.size==(1080,1350),card.size
          vqa=json.load(open('output/visual_structural_qa.json',encoding='utf-8'))
          assert all(vqa['structural_checks'].values()),vqa
          assert job.get('publication_authorized') is False
          print('ACTUAL_ARTIFACT_TECHNICAL_QA_PASS',duration)
          print('SUMMARY_CARD_TECHNICAL_QA_PASS',card.size)
          PYQA

      - name: Upload DecisionOS production bundle
        if: steps.job.outputs.has_job == 'true' && steps.guard.outputs.should_render == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DecisionOS-Production-${{ steps.job.outputs.job_id }}-Bundle-v1
          path: |
            output/*.mp4
            output/linkedin_summary_card.png
            output/technical_qa.json
            output/visual_structural_qa.json
            output/voice_manifest.json
            rendered/scenes/*.png
          if-no-files-found: error
          retention-days: 7
